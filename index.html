<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff0f6"><title>Una aventura para amor ♡</title>
<style>
:root{--pink:#ed9abb;--deep:#bd5c88;--soft:#fff0f6;--ink:#68485a;--muted:#9b7c8c;--line:#f2d5e2;--shadow:0 18px 55px #b7688f20}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 12% 12%,#ffe1ed 0,transparent 26%),radial-gradient(circle at 88% 82%,#fce4ef 0,transparent 28%),linear-gradient(135deg,#fff9fc,#fff0f6);overflow-x:hidden}
button{font:inherit;cursor:pointer}#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}.floater{position:absolute;bottom:-50px;opacity:.24;animation:rise linear infinite;color:#e98db5}@keyframes rise{to{transform:translateY(-115vh) rotate(18deg);opacity:0}}
.app{position:relative;z-index:1;width:min(790px,calc(100% - 24px));margin:auto;padding:20px 0 42px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.brand{font-size:.82rem;font-weight:900;letter-spacing:.05em;color:var(--deep)}.progress-wrap{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.74rem;font-weight:800}.progress{width:105px;height:8px;border-radius:20px;background:#f5dce7;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#f3a8c7,#d86f9e);border-radius:20px;transition:width .5s}
.card{background:#ffffffdf;border:1px solid #ffffffed;border-radius:27px;padding:clamp(20px,5vw,40px);box-shadow:var(--shadow);backdrop-filter:blur(10px);animation:appear .4s ease both}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.center{text-align:center}.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.15em;color:var(--deep);font-weight:900}h1{font-size:clamp(2.2rem,7vw,3.8rem);line-height:1.02;margin:12px 0;color:#b95783;letter-spacing:-.05em}h2{font-size:clamp(1.6rem,5vw,2.35rem);line-height:1.12;margin:10px 0 12px;color:#b95783;letter-spacing:-.035em}p{line-height:1.7;color:var(--muted);font-size:.98rem}.sub{max-width:540px;margin:0 auto 20px}.hero-art{font-size:clamp(4.5rem,16vw,7rem);margin:16px auto 8px;filter:drop-shadow(0 8px 12px #f6c8dc)}
.btn{border:0;border-radius:999px;padding:13px 22px;font-weight:850;color:white;background:linear-gradient(135deg,#ee9cbd,#d76d9d);box-shadow:0 9px 20px #d36f9d40;transition:.2s;display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:46px}.btn:hover{transform:translateY(-2px)}.btn.secondary{background:#fff0f6;color:#bd628b;box-shadow:none;border:1px solid #f6d5e3}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:22px}.pill{display:inline-block;padding:7px 12px;background:#fff0f6;color:#c36b92;border-radius:30px;font-size:.76rem;font-weight:850}.level-icon{font-size:3rem;margin:12px 0 4px}.options{display:grid;gap:10px;margin:20px auto 0;max-width:540px}.option{border:1.5px solid var(--line);background:#fffafd;border-radius:15px;padding:13px 15px;text-align:left;color:var(--ink);font-weight:750;transition:.18s}.option:hover,.option.selected{border-color:#d96f9f;background:#fff0f6;color:#b95783}.feedback{min-height:26px;margin:13px 0 0;font-weight:800;color:#b95783}.note{background:#fff5f9;border:1px dashed #efb7ce;padding:13px 15px;border-radius:15px;color:#a66d87;font-size:.9rem;line-height:1.6;margin:16px 0}
.room-scene{position:relative;min-height:190px;border-radius:22px;background:linear-gradient(180deg,#fce8f1,#fff7fa);border:1px solid #f4d8e5;margin:18px 0;padding:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}.room-scene:before,.room-scene:after{content:"";position:absolute;bottom:0;width:34%;height:46%;background:#f8dce8;border-radius:60% 60% 0 0;opacity:.45}.room-scene:before{left:-8%}.room-scene:after{right:-8%}.scene-emoji{position:relative;z-index:1;font-size:clamp(3.5rem,12vw,5.5rem);filter:drop-shadow(0 8px 8px #bd5c8825)}.room-label{position:absolute;top:12px;left:14px;font-size:.68rem;letter-spacing:.13em;text-transform:uppercase;color:#c07898;font-weight:900}
.clue-list{display:grid;gap:9px;margin:18px auto;max-width:540px}.clue{border:1px solid var(--line);background:#fffafd;border-radius:14px;padding:12px;text-align:left;color:#805a6d;line-height:1.5}.clue strong{color:#b95783}.input-row{display:flex;gap:8px;max-width:400px;margin:16px auto}.answer-input{min-width:0;flex:1;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;color:var(--ink);background:#fffafd;font:inherit;outline:none}.answer-input:focus{border-color:#dc85aa;box-shadow:0 0 0 3px #fce1ec}
.memory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px auto;max-width:540px}.memory{min-height:104px;border:1.5px solid var(--line);border-radius:17px;background:#fffafd;color:var(--ink);font-weight:800;padding:13px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:7px}.memory span{font-size:1.7rem}.memory.found{background:#fff0f6;border-color:#df8eb1;color:#b95783}
.heart-board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-width:430px;margin:20px auto}.heart-cell{aspect-ratio:1;border:1.5px solid var(--line);border-radius:15px;background:#fffafd;font-size:1.55rem;color:#e28bb0;transition:.2s}.heart-cell:hover{transform:scale(1.04)}.heart-cell.found{background:#ffe7f0;border-color:#e28bb0}
.memory-match{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:460px;margin:20px auto}.match-card{aspect-ratio:1;border:1.5px solid var(--line);border-radius:14px;background:#fffafd;font-size:1.6rem;color:#bd628b}.match-card.open,.match-card.done{background:#fff0f6;border-color:#df8eb1}
.final-gift{font-size:5rem;animation:bob 2.8s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(3deg)}}.letter{background:#fff9fc;border:1px solid #f6dce7;border-radius:17px;padding:19px;text-align:left;margin:18px 0;color:#805a6d;line-height:1.8;white-space:pre-line}.footer{text-align:center;color:#c49aad;font-size:.73rem;margin:16px}.hidden{display:none!important}
@media(max-width:480px){.app{width:calc(100% - 18px);padding-top:14px}.brand{font-size:.7rem}.progress{width:70px}.card{border-radius:22px;padding:22px 16px}.memory-grid{gap:8px}.memory{min-height:95px;font-size:.88rem}.heart-board{gap:7px}.memory-match{gap:6px}.match-card{border-radius:10px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body><div id="floaters" aria-hidden="true"></div><main class="app">
<header class="topbar"><div class="brand">♡ UNA AVENTURA PARA AMOR</div><div class="progress-wrap"><span id="stepLabel">Inicio</span><div class="progress"><span id="progressBar"></span></div></div></header>
<section id="game" class="card center" aria-live="polite"></section><div class="footer">Hecho con cariño, solamente para vos ♡</div></main>
<script>
/* PERSONALIZÁ ESTE OBJETO PARA QUE EL JUEGO CUENTE SU HISTORIA REAL. */
const CONFIG={
 nombre:"amor",
 preguntas:[
  {q:"¿Qué hace especial nuestra historia?",o:["Cada pequeño momento juntos","Que todo salga perfecto","No tener nunca diferencias"],a:0,ok:"¡Sí! Lo especial está en cada pequeño momento ♡"},
  {q:"Si pudiéramos repetir un día juntos, ¿qué elegiríamos?",o:["Un día lleno de recuerdos lindos","Un día sin hablar","Un día mirando el reloj"],a:0,ok:"¡Ese recuerdo merece quedarse para siempre!"},
  {q:"¿Qué nunca debería faltar entre nosotros?",o:["Las risas, el cariño y la complicidad","Las discusiones","Las apuradas"],a:0,ok:"¡Exacto! Que nunca nos falten esas cosas."},
  {q:"¿Cuál es el mejor plan?",o:["Compartir tiempo juntos","Estar pendientes del celular","Apurarnos para irnos"],a:0,ok:"El mejor plan es estar juntos."}
 ],
 recuerdos:[
  {i:"🌷",t:"Nuestro primer encuentro"},{i:"✨",t:"Una charla interminable"},
  {i:"☁️",t:"Un día que nos hizo reír"},{i:"💗",t:"Un abrazo que no olvidamos"},
  {i:"🌙",t:"Una noche especial"},{i:"🎀",t:"Un detalle que guardamos"}
 ],
 regaloTitulo:"¡Tu sorpresa te está esperando!",
 regaloTexto:"Mi amor, preparé esto porque quería regalarte algo diferente. Gracias por cada sonrisa, cada abrazo y cada momento compartido. Ojalá sigamos creando recuerdos hermosos y sumando aventuras. Te quiero muchísimo. ♡",
 regaloEmoji:"🎁"
};
const $=id=>document.getElementById(id), game=$("game");
let qIndex=0,memories=new Set(),hearts=new Set(),matchOpen=[],matchDone=new Set(),selected=null,roomUnlocked={};
const steps=["Inicio","La entrada","La biblioteca","El jardín","La habitación secreta","El tesoro"];
function progress(n){$("stepLabel").textContent=steps[n]||"El tesoro";$("progressBar").style.width=(n/5*100)+"%"}
function shell(k,icon,title,desc,content="",button="Continuar ♡",action=""){game.innerHTML=`<div class="eyebrow">${k}</div><div class="room-scene"><div class="room-label">Habitación ${Math.min(Object.keys(roomUnlocked).length+1,5)}</div><div class="scene-emoji">${icon}</div></div><h2>${title}</h2><p class="sub">${desc}</p>${content}<div class="actions"><button class="btn" onclick="${action}">${button}</button></div>`}
function intro(){progress(0);game.innerHTML=`<div class="eyebrow">Una historia, dos corazones</div><div class="hero-art">🌸💗🌸</div><h1>Una aventura<br>para ${CONFIG.nombre}</h1><p class="sub">Alguien preparó un pequeño mundo para vos. Hay habitaciones secretas, acertijos, recuerdos y un tesoro que espera al final del camino.</p><div class="pill">✦ 5 habitaciones · 8 desafíos · 1 sorpresa ✦</div><div class="actions"><button class="btn" onclick="hallway()">Entrar a la aventura ♡</button></div>`}
function hallway(){progress(1);shell("Prólogo · La puerta de entrada","🚪","La casa de los secretos","Frente a vos hay una puerta rosa. Una nota está pegada en la madera. Para entrar, tendrás que descubrir la palabra que abre el primer cerrojo.",`<div class="note">«No se puede tocar, pero se puede sentir. Crece cuando se comparte y hace que dos personas se sientan cerca. ¿Qué es?»</div><div class="input-row"><input id="riddle1" class="answer-input" placeholder="Escribí la respuesta..." autocomplete="off"><button class="btn" onclick="checkText('riddle1',['amor','el amor'],'room1()')">Abrir</button></div><div class="feedback" id="fb"></div>`,"", "");}
function checkText(id,answers,next){let v=$(id).value.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");let valid=answers.map(x=>x.normalize("NFD").replace(/[\u0300-\u036f]/g,""));if(valid.includes(v)){roomUnlocked[id]=true;eval(next)}else{$("fb").textContent="Esa no es la palabra… pensá en algo que se siente con el corazón 💗"}}
function room1(){progress(1);shell("Habitación 1 · El recibidor","🗝️","La llave escondida","Encontraste la entrada. Ahora hay tres llaves. Solo una abre la siguiente habitación. Elegí la que representa lo que mantiene viva una historia.",`<div class="options"><button class="option" onclick="keyChoice(this,false)">🏆 Ganar siempre</button><button class="option" onclick="keyChoice(this,true)">🤝 Cuidarse y elegirse</button><button class="option" onclick="keyChoice(this,false)">⏳ Esperar que todo pase solo</button></div><div class="feedback" id="fb"></div>`,"Desbloquear la biblioteca","room2()");}
function keyChoice(el,ok){document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");if(ok){$("fb").textContent="¡La llave brilló! Una puerta se abrió ✨";roomUnlocked.key=true}else $("fb").textContent="La llave no encaja. Probá otra vez 💗"}
function room2(){progress(2);shell("Habitación 2 · La biblioteca de recuerdos","📚","Los libros de nuestra historia","En esta biblioteca hay recuerdos guardados en pequeños libros. Abrí todos para reunir las piezas del código secreto.",`<div class="memory-grid">${CONFIG.recuerdos.map((r,i)=>`<button class="memory ${memories.has(i)?"found":""}" onclick="reveal(${i})"><span>${memories.has(i)?r.i:"📕"}</span>${memories.has(i)?r.t:"Abrir recuerdo"}</button>`).join("")}</div><div class="feedback">${memories.size}/${CONFIG.recuerdos.length} recuerdos encontrados</div>`,"Resolver el acertijo","room2Riddle()");document.querySelector(".actions .btn").disabled=memories.size!==CONFIG.recuerdos.length}
function reveal(i){memories.add(i);room2()}
function room2Riddle(){progress(2);shell("Habitación 2 · El escritorio secreto","📝","El mensaje entre páginas","En un papel encontraste una pista: «Tengo cuatro letras, empieza con A y es lo que le da sentido a esta aventura». ¿Qué palabra es?",`<div class="note">Pista: la respuesta está en el nombre de esta aventura. ♡</div><div class="input-row"><input id="riddle2" class="answer-input" placeholder="La palabra secreta..."><button class="btn" onclick="checkText('riddle2',['amor'],'room3()')">Probar</button></div><div class="feedback" id="fb"></div>`,"","")}
function room3(){progress(3);shell("Habitación 3 · El jardín encantado","🌷","El jardín de los seis corazones","Una brisa movió las flores y escondió seis corazones. Tocá las macetas para encontrarlos. ¡Cuidado! Algunas flores solo tienen destellos.",`<div class="heart-board">${Array.from({length:16},(_,i)=>`<button class="heart-cell" onclick="findHeart(${i},this)">${hearts.has(i)?"💗":"🌸"}</button>`).join("")}</div><div class="feedback" id="heartCount">${hearts.size}/6 corazones encontrados</div>`,"Entrar a la habitación secreta","room4()");document.querySelector(".actions .btn").disabled=hearts.size<6}
function findHeart(i,el){const targets=[1,4,7,10,13,15];if(hearts.has(i))return;if(targets.includes(i)){hearts.add(i);el.textContent="💗";el.classList.add("found");$("heartCount").textContent=hearts.size+"/6 corazones encontrados";if(hearts.size===6)document.querySelector(".actions .btn").disabled=false}else{el.textContent="✨";setTimeout(()=>{if(el.isConnected&&!hearts.has(i))el.textContent="🌸"},650)}}
function room4(){progress(4);const symbols=["🌙","🌸","💗","⭐","🌸","💗","⭐","🌙"];matchOpen=[];matchDone.clear();shell("Habitación 4 · El observatorio","🔭","El mapa de las constelaciones","Las estrellas se desordenaron. Encontrá las cuatro parejas iguales para reconstruir el mapa. Tocá dos cartas por turno.",`<div class="memory-match">${symbols.map((s,i)=>`<button class="match-card" id="mc${i}" onclick="flip(${i})">❔</button>`).join("")}</div><div class="feedback" id="matchCount">0/4 parejas encontradas</div>`,"Abrir la última puerta","room5()");window.matchSymbols=symbols;document.querySelector(".actions .btn").disabled=true}
function flip(i){if(matchOpen.includes(i)||matchDone.has(i)||matchOpen.length===2)return;matchOpen.push(i);$("mc"+i).textContent=window.matchSymbols[i];$("mc"+i).classList.add("open");if(matchOpen.length===2){let [a,b]=matchOpen;if(window.matchSymbols[a]===window.matchSymbols[b]){matchDone.add(a);matchDone.add(b);$("mc"+a).classList.add("done");$("mc"+b).classList.add("done");matchOpen=[];$("matchCount").textContent=(matchDone.size/2)+"/4 parejas encontradas";if(matchDone.size===8)document.querySelector(".actions .btn").disabled=false}else{setTimeout(()=>{[a,b].forEach(x=>{if(!$("mc"+x))return;$("mc"+x).textContent="❔";$("mc"+x).classList.remove("open")});matchOpen=[]},850)}}}
function room5(){progress(5);shell("Habitación 5 · La cámara del tesoro","🔐","El último código","La puerta final tiene un código de cuatro letras. Es la palabra que apareció en la biblioteca y que está presente en cada paso de esta aventura.",`<div class="room-scene"><div class="scene-emoji">💝</div></div><div class="input-row"><input id="finalCode" class="answer-input" placeholder="Código secreto..." maxlength="12"><button class="btn" onclick="checkText('finalCode',['amor'],'treasure()')">Desbloquear</button></div><div class="feedback" id="fb"></div>`,"","")}
function treasure(){progress(5);game.innerHTML=`<div class="eyebrow">Tesoro desbloqueado · Solo para vos</div><div class="final-gift">${CONFIG.regaloEmoji}</div><h2>${CONFIG.regaloTitulo}</h2><p class="sub">Llegaste al final de esta aventura. Pero lo más lindo es que nuestra historia todavía tiene muchísimas páginas por escribir.</p><div class="letter">${CONFIG.regaloTexto}</div><div class="pill">Con todo mi amor, para vos ♡</div><div class="actions"><button class="btn secondary" onclick="restart()">Volver a vivir la aventura</button></div>`;celebrate()}
function restart(){qIndex=0;memories.clear();hearts.clear();matchDone.clear();roomUnlocked={};intro()}
function celebrate(){const layer=$("floaters");for(let i=0;i<18;i++){const s=document.createElement("span");s.className="floater";s.textContent=["♡","💗","✦","🌸"][i%4];s.style.left=Math.random()*100+"%";s.style.animationDuration=(8+Math.random()*6)+"s";s.style.fontSize=(14+Math.random()*18)+"px";layer.appendChild(s);setTimeout(()=>s.remove(),15000)}}
(function ambient(){const layer=$("floaters");for(let i=0;i<12;i++){const s=document.createElement("span");s.className="floater";s.textContent=["♡","✦","♥","✿"][i%4];s.style.left=Math.random()*100+"%";s.style.animationDuration=(28+Math.random()*20)+"s";s.style.animationDelay=(-Math.random()*35)+"s";s.style.fontSize=(12+Math.random()*17)+"px";layer.appendChild(s)}})();
intro();
</script></body></html>
